<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>List of Shippers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.2/themes/base/theme.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.2/dist/themes/base/jquery-ui.min.css">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.2/dist/jquery-ui.min.js"></script>
<script src="https://cdn.datatables.net/v/dt/dt-3.1.4/datatables.min.js"></script>
</head>
<body>
<button type="button" id="addBtn">Add Shipper</button>
<hr/>
  <table border="1" id="shipperstbl">
        <thead>
            <tr>
                <th  style="display: none;">ID</th>
                <th>Company Name</th>
                <th>Phone</th>
                <th>Added On</th>
                <th>Added By</th>
                <th>Edited On</th>
                <th>Edited By</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
       
    </table>
    
<div id="editDialog" title="Edit Shipper"></div>
<div id="deleteDialog" title="Delete Shipper">
    <p>Are you sure you want to delete <strong id="deleteName"></strong>?</p>
</div>

<script>
var shippersTable;
var deleteId = null;

function refreshTable() {
    shippersTable.ajax.reload(null, false);   // false = stay on the current page
}

function openEditDialog(id) {
    loadIntoDialog('/edit/' + id, 'Edit Shipper');
}

function openAddDialog() {
    loadIntoDialog('/add', 'Add Shipper');
}

function loadIntoDialog(url, title) {
    $('#editDialog').load(url + ' #editForm', function (response, status) {
        if (status === 'error' || $('#editForm').length === 0) {
            alert('Could not load the form.');
            return;
        }
        $('#editDialog').dialog('option', 'title', title).dialog('open');
    });
}

function saveShipper() {
    var form = $('#editForm')[0];
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    $.post($('#editForm').attr('action'), $('#editForm').serialize())
        .done(function () {
            $('#editDialog').dialog('close');
            refreshTable();
        })
        .fail(function (xhr) {
            if (xhr.status === 404) {
                alert('That shipper no longer exists.');
                $('#editDialog').dialog('close');
                refreshTable();
            } else {
                alert('Save failed.');
            }
        });
}

function deleteShipper() {
    $.ajax({ url: '/api/shippers/' + deleteId, type: 'DELETE' })
        .done(function () {
            $('#deleteDialog').dialog('close');
            refreshTable();
        })
        .fail(function (xhr) {
            $('#deleteDialog').dialog('close');
            if (xhr.status === 404) {
                alert('That shipper no longer exists.');
                refreshTable();
            } else {
                alert('Delete failed (HTTP ' + xhr.status + ').');
            }
        });
}

function actionLink(cssClass, label, row) {
    return $('<a href="#"></a>')
        .addClass(cssClass)
        .text(label)
        .attr('data-id', row.shipperId)
        .attr('data-name', row.companyName)
        [0].outerHTML;                       // jQuery escapes the attribute values for us
}

$(function () {
    var text = $.fn.dataTable.render.text();   // HTML-escapes cell values

    shippersTable = $('#shipperstbl').DataTable({
        ajax: { url: '/api/shippers', dataSrc: '' },
        columns: [
            { data: 'shipperId', visible: false },
            { data: 'companyName', render: text },
            { data: 'phone',       render: text },
            { data: 'addedOn',     render: text },
            { data: 'addedBy',     render: text },
            { data: 'editedOn',    render: text },
            { data: 'editedBy',    render: text },
            { data: null, orderable: false, searchable: false,
              render: function (d, t, row) { return actionLink('edit-link', 'Edit', row); } },
            { data: null, orderable: false, searchable: false,
              render: function (d, t, row) { return actionLink('delete-link', 'Delete', row); } }
        ],
        columnDefs: [{ targets: '_all', defaultContent: '' }]   // null dates/names show as blank
    });

    // Add / Edit dialog
    $('#editDialog').dialog({
        autoOpen: false, modal: true, width: 450,
        buttons: {
            "Save": function () { saveShipper(); },
            "Cancel": function () { $(this).dialog('close'); }
        }
    });
    $('#editDialog').on('submit', '#editForm', function (e) {
        e.preventDefault();
        saveShipper();
    });
    $('#addBtn').on('click', function () { openAddDialog(); });

    // Delete dialog
    $('#deleteDialog').dialog({
        autoOpen: false, modal: true, width: 400,
        buttons: {
            "Delete": function () { deleteShipper(); },
            "Cancel": function () { $(this).dialog('close'); }
        }
    });

    // Row links (delegated, because DataTables creates the rows dynamically)
    $('#shipperstbl').on('click', '.edit-link', function (e) {
        e.preventDefault();
        openEditDialog($(this).data('id'));
    });
    $('#shipperstbl').on('click', '.delete-link', function (e) {
        e.preventDefault();
        deleteId = $(this).data('id');
        $('#deleteName').text($(this).data('name'));
        $('#deleteDialog').dialog('open');
    });
});
</script>
</body>
</html>
